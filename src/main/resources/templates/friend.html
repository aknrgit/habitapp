<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: common-head('友達')}"></head>

<body class="bg-light">

<div th:replace="~{fragments :: header}"></div>

<div class="container py-5">

    <h1 class="fw-bold mb-4">友達</h1>

    <div class="card shadow-sm mb-4">

    <div class="card-body text-center">

        <h4>👤 あなたの友達コード</h4>

        <h2 class="fw-bold text-primary"
            id="myFriendCode"
            th:text="${loginUser.friendCode}">
        </h2>

        <button
            class="btn btn-outline-primary mt-2"
            onclick="copyFriendCode()">

            コピー

        </button>

    </div>

</div>

    <!-- 友達追加 -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h3 class="fw-bold mb-3">友達を追加</h3>

            <form th:action="@{/friend/add}" method="post">

                <div class="mb-3">
                    <label class="form-label">友達コード</label>

                    <input type="text"
                           name="friendCode"
                           class="form-control"
                           placeholder="友達コードを入力"
                           required>
                </div>

                <button type="submit" class="btn btn-primary">
                    友達追加
                </button>

            </form>

        </div>
    </div>

    <!-- 登録済みの友達 -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h3 class="fw-bold mb-3">登録済みの友達</h3>

            <div th:if="${friends == null || friends.isEmpty()}">
                <p class="text-muted">まだ友達が登録されていません。</p>
            </div>

            <div th:each="friend : ${friends}"
                 class="border rounded p-3 mb-3 d-flex justify-content-between align-items-center">

                <div>
                    <h5 class="fw-bold mb-1"
                        th:text="${friend.loginId}">
                        友達名
                    </h5>

                    <p class="text-muted mb-0">
                        友達コード：
                        <span th:text="${friend.friendCode}"></span>
                    </p>
                </div>

                <a th:href="@{/friend/timeline/{id}(id=${friend.id})}"
                   class="btn btn-success">
                    タイムラインを見る
                </a>

            </div>

        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/today}" class="btn btn-secondary">
            戻る
        </a>
    </div>

</div>

<div th:replace="~{fragments :: footer}"></div>

<script>
function copyFriendCode() {
    const code = document.getElementById("myFriendCode").innerText.trim();

    const textarea = document.createElement("textarea");
    textarea.value = code;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    try {
        document.execCommand("copy");
        alert("友達コードをコピーしました！");
    } catch (e) {
        alert("コピーに失敗しました。手動でコピーしてください。");
    }

    document.body.removeChild(textarea);
}
</script>
</body>
</html>

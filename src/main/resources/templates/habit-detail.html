<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>習慣詳細</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments :: header"></div>

<main class="container py-5">

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <h1 class="fw-bold mb-3" th:text="${habit.title}"></h1>

            <p class="text-muted" th:text="${habit.description}"></p>

            <h5 class="mt-4">今月の達成率</h5>
            <p class="fw-bold">
                <span th:text="${achievementRate}"></span>%
            </p>
            

            

            <a href="/today" class="btn btn-secondary mt-3">戻る</a>

        </div>
    </div>

</main>

<div th:replace="fragments :: footer"></div>

</body>
</html>

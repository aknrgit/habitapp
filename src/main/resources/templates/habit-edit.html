<!DOCTYPE html>
<head th:replace="~{fragments :: common-head('習慣編集')}"></head>
<body class="bg-light">

<div th:replace="fragments :: header"></div>

<main class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold">習慣編集</h1>
        <p class="text-muted">内容を変更して更新してください。</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form action="/habits/update" method="post">

                <!-- id -->
                <input type="hidden" name="id" th:value="${habit.id}">

                <div class="mb-3">
                    <label class="form-label">習慣名</label>
                    <input class="form-control form-control-lg"
                           type="text"
                           name="title"
                           th:value="${habit.title}">
                </div>

                <div class="mb-4">
                    <label class="form-label">説明</label>
                    <input class="form-control form-control-lg"
                           type="text"
                           name="description"
                           th:value="${habit.description}">
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary btn-lg">更新</button>

                    <a href="/habits" class="btn btn-secondary btn-lg">
                        戻る
                    </a>
                </div>

            </form>

        </div>
    </div>

</main>

<div th:replace="fragments :: footer"></div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments :: header"></div>
<div class="container mt-4">
    <h1>習慣編集画面</h1>
<form action="/habits/update" method="post">

    <!-- 今の値を表示＋編集 -->
    <input type="hidden" name="id" th:value="${habit.id}">

    <input type="text" name="title" th:value="${habit.title}">
    <input type="text" name="description" th:value="${habit.description}">

    <button type="submit">更新</button>
</form>
<div th:replace="fragments :: footer"></div>
</body>

</html>

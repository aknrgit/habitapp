<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>Habit App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments :: header"></div>

<main class="container py-5">

    <!-- タイトル -->
    <div class="mb-4">
        <h1 class="fw-bold mb-2">習慣一覧</h1>
        <p class="text-muted">毎日の習慣を記録して、継続を見える化しましょう。</p>
    </div>

    <!-- 入力フォーム -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
            <form action="/habits" method="post" class="row g-3">
                <div class="col-md-5">
                    <input class="form-control form-control-lg" type="text" name="title" placeholder="習慣名">
                </div>

                <div class="col-md-5">
                    <input class="form-control form-control-lg" type="text" name="description" placeholder="説明">
                </div>

                <div class="col-md-2 d-grid">
                    <button class="btn btn-primary btn-lg" type="submit">追加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 一覧 -->
    <div class="row g-3 mb-4">
        <div class="col-12" th:each="task : ${habits}">
            <div class="card shadow-sm border-0">
                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <h5 class="fw-bold mb-1" th:text="${task.title}"></h5>
                        <p class="text-muted mb-0" th:text="${task.description}"></p>
                    </div>

                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-danger btn-sm"
                           th:href="@{/habits/delete(id=${task.id})}"
                           onclick="return confirm('削除しますか？')">削除</a>

                        <a class="btn btn-outline-warning btn-sm"
                           th:href="@{/habits/edit(id=${task.id})}">編集</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- 👇 応援キャラ（下に配置） -->
    <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4">

            <h5 class="fw-bold mb-3">今日の応援キャラ</h5>

            <img th:src="@{${characterImage}}"
                 alt="キャラクター"
                 class="img-fluid mb-3"
                 style="max-width: 180px;">

            <p class="fw-bold mb-0" th:text="${message}"></p>

        </div>
    </div>

</main>

<div th:replace="fragments :: footer"></div>

</body>
</html>

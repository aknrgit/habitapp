<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments :: header"></div>
<div class="container mt-4">

    <h1 class="mb-4">習慣一覧</h1>

    <!-- 入力フォーム -->
    <form action="/habits" method="post" class="d-flex gap-2 mb-4">
        <input class="form-control" type="text" name="title" placeholder="習慣名">
        <input class="form-control" type="text" name="description" placeholder="説明">
        <button class="btn btn-primary" type="submit">追加</button>
    </form>

    <!-- 一覧 -->
    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center"
            th:each="task : ${habits}">

            <div>
                <strong th:text="${task.title}"></strong><br>
                <small class="text-muted" th:text="${task.description}"></small>
            </div>

            <div>
                <a class="btn btn-sm btn-danger"
                   th:href="@{/habits/delete(id=${task.id})}">削除</a>

                <a class="btn btn-sm btn-warning"
                   th:href="@{/habits/edit(id=${task.id})}">編集</a>
            </div>

        </li>
    </ul>

</div>
<div th:replace="fragments :: footer"></div>
</body>
</html>

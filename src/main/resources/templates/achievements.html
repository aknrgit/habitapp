<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>達成記録一覧</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="fragments :: header"></div>

<main class="container py-5">

    <!-- タイトル -->
    <div class="mb-5 text-center">

        <h1 class="fw-bold">
            達成記録一覧
        </h1>

        <p class="text-muted">
            毎日の積み重ねを振り返ろう 👍
        </p>

    </div>

    <!-- 日付ごとの達成記録 -->
    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <!-- Mapを1件ずつ取り出す -->
            <div th:each="entry : ${achievementMap}"
                 class="border-bottom py-4">

                <!-- 日付 -->
                <h4 class="fw-bold mb-3"
                    th:text="${entry.key}">
                </h4>

                <!-- 習慣一覧 -->
                <div class="mb-3">

                    <span th:each="title : ${entry.value}"
                          th:text="${title}"
                          class="badge bg-primary me-2 p-2">
                    </span>

                </div>

                <!-- 感想 -->
                <div class="mt-2">

                    <span class="fw-bold">
                        感想：
                    </span>

                    <span th:text="${commentMap[entry.key]}">
                    </span>

                </div>

            </div>

        </div>

    </div>

    <!-- 戻る -->
    <div class="text-center mt-5">

        <a href="/today"
           class="btn btn-secondary">

            戻る

        </a>

    </div>

</main>

<div th:replace="fragments :: footer"></div>

</body>
</html>

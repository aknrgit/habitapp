<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ユーザー登録</title>
</head>
<body>

<h1>ユーザー登録</h1>

<form action="/register" method="post">

    <p>ログインID</p>
    <input type="text" name="loginId">

    <p>パスワード</p>
    <input type="password" name="password">

    <button type="submit">
        登録
    </button>

</form>

</body>
</html>

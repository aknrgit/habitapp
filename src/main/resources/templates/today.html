<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: common-head('今日の習慣')}"></head>

<body class="bg-light">

<div th:replace="fragments :: header"></div>

<main class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold mb-2">今日の習慣</h1>
        <p class="text-muted">ログイン中：<span th:text="${loginUser.loginId}"></span></p>
        <p class="text-muted">今日やる習慣を確認して、できたら記録しましょう。</p>
    </div>

    <div class="row g-3">
        <div class="col-12" th:each="task : ${habits}">
            <div class="card shadow-sm border-0">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <a th:href="@{/habits/{id}(id=${task.id})}"
                    class="text-decoration-none text-dark">
                        <h5 class="fw-bold mb-1" th:text="${task.title}"></h5>
                    </a>
                    <p class="text-muted mb-2">今月の達成率：<span th:text="${achievementRates[task.id]}"></span>%</p>
                   <div>

    <!-- 未達成 -->
    <form th:if="${!completedHabitIds.contains(task.id)}"
          action="/habits/complete"
          method="post">

        <input type="hidden"
               name="habitId"
               th:value="${task.id}">

        <button class="btn btn-success">
            今日できた
        </button>
    </form>

    <!-- 達成済み -->
    <button th:if="${completedHabitIds.contains(task.id)}"
            class="btn btn-secondary"
            disabled>

        達成済み

    </button>

</div>

                </div>
            </div>
        </div>
    </div>
    <!-- 👇 応援キャラ（下に配置） -->
    <div class="card shadow-sm border-0 text-center mt-4">
        <div class="card-body p-4">

            <h5 class="fw-bold mb-3">今日の応援キャラ</h5>

            <img th:src="${characterImage}"
                 alt="キャラクター"
                 class="img-fluid mb-3"
                 style="max-width: 180px;">

            <p class="fw-bold mb-0" th:text="${message}"></p>

        </div>
    </div>


</main>


<div th:replace="fragments :: footer"></div>

</body>
</html>

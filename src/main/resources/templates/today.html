<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>今日の習慣 | Habit App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments :: header"></div>

<main class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold mb-2">今日の習慣</h1>
        <p class="text-muted">今日やる習慣を確認して、できたら記録しましょう。</p>
    </div>

    <div class="row g-3">
        <div class="col-12" th:each="task : ${habits}">
            <div class="card shadow-sm border-0">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <a th:href="@{/habits/{id}(id=${task.id})}"
                    class="text-decoration-none text-dark">
                        <h5 class="fw-bold mb-1" th:text="${task.title}"></h5>
                    </a>
                    <p class="text-muted mb-2">今月の達成率：<span th:text="${achievementRates[task.id]}"></span>%</p>
                   <div>

    <!-- 未達成 -->
    <form th:if="${!completedHabitIds.contains(task.id)}"
          action="/habits/complete"
          method="post">

        <input type="hidden"
               name="habitId"
               th:value="${task.id}">

        <button class="btn btn-success">
            今日できた
        </button>
    </form>

    <!-- 達成済み -->
    <button th:if="${completedHabitIds.contains(task.id)}"
            class="btn btn-secondary"
            disabled>

        達成済み

    </button>

</div>

                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="fragments :: footer"></div>

</body>
</html>

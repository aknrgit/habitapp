<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: common-head('1日の流れ')}"></head>

<body class="bg-light">

<div th:replace="fragments :: header"></div>

<main class="container py-5">

    <!-- タイトル -->
    <div class="mb-4">

        <h1 class="fw-bold">
            1日の流れ
        </h1>

        <p class="text-muted">
            平日・休日ごとに、
            5:00〜22:00までの予定を入力できます。
        </p>

    </div>



    <!-- スケジュール -->
    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

           <table class="table table-bordered align-middle bg-white">

    <thead class="table-light">
        <tr>
            <th style="width: 100px;">時間</th>
            <th>平日</th>
            <th>休日</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="hour : ${hours}">

            <td class="fw-bold" th:text="${hour} + ':00'"></td>

            <!-- 平日 -->
            <td>
                <form action="/daily-schedule"
                      method="post"
                      class="d-flex align-items-center gap-2">

                    <span class="fw-bold text-primary"
                          style="width: 400px;"
                          th:text="${weekdayMap[hour.toString()]}">
                    </span>

                    <input type="hidden"
                           name="scheduleTime"
                           th:value="${hour < 10 ? '0' + hour + ':00' : hour + ':00'}">

                    <input type="hidden"
                           name="scheduleType"
                           value="WEEKDAY">

                    <input type="text"
                           name="content"
                           class="form-control form-control-sm"
                           placeholder="入力">

                    <button class="btn btn-primary btn-sm" type="submit">
                        保存
                    </button>
                </form>
            </td>

            <!-- 休日 -->
            <td>
                <form action="/daily-schedule"
                      method="post"
                      class="d-flex align-items-center gap-2">

                    <span class="fw-bold text-success"
                          style="width: 400px;"
                          th:text="${holidayMap[hour.toString()]}">
                    </span>

                    <input type="hidden"
                           name="scheduleTime"
                           th:value="${hour < 10 ? '0' + hour + ':00' : hour + ':00'}">

                    <input type="hidden"
                           name="scheduleType"
                           value="HOLIDAY">

                    <input type="text"
                           name="content"
                           class="form-control form-control-sm"
                           placeholder="入力">

                    <button class="btn btn-primary btn-sm" type="submit">
                        保存
                    </button>
                </form>
            </td>

        </tr>
    </tbody>

</table>

        </div>

    </div>

    <!-- 戻る -->
    <div class="mt-4">

        <a href="/today"
           class="btn btn-secondary">

            戻る

        </a>

    </div>

</main>

<div th:replace="fragments :: footer"></div>

</body>
</html>

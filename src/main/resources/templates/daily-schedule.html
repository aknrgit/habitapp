<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>1日の流れ</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments :: header"></div>

<main class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold">1日の流れ</h1>
        <p class="text-muted">平日・休日ごとに、5:00〜22:00までの予定を入力できます。</p>
    </div>

    <!-- 平日・休日切り替え -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">

            <label class="form-label fw-bold">スケジュールタイプ</label>

            <select class="form-select">
                <option value="WEEKDAY">平日</option>
                <option value="HOLIDAY">休日</option>
            </select>

        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <table class="table table-bordered align-middle bg-white">

                <thead class="table-light">
                    <tr>
                        <th style="width: 120px;">時間</th>
                        <th>予定</th>
                        <th style="width: 240px;">操作</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="hour : ${hours}">

                        <td class="fw-bold"
                            th:text="${hour} + ':00'">
                        </td>

                        <td>
                            <input type="text"
                                   class="form-control"
                                   placeholder="予定を入力">
                        </td>

                        <td>
                            <button class="btn btn-primary btn-sm">
                                保存
                            </button>

                            <button class="btn btn-success btn-sm">
                                編集
                            </button>

                            <button class="btn btn-danger btn-sm">
                                削除
                            </button>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>
    </div>

    <div class="mt-4">
        <a href="/today" class="btn btn-secondary">戻る</a>
    </div>

</main>

<div th:replace="fragments :: footer"></div>

</body>
</html>
